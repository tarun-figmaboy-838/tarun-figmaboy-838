# Refreshes the generated profile images once a day and publishes them to the
# `output` branch (so the main branch history stays clean):
#   stats.svg        animated stats card   (scripts/generate_stats.py)
#   snake-*.svg      contribution snake    (Platane/snk)
name: Profile assets

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/profile-assets.yml"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Keep the last stats card as a fallback
        run: |
          mkdir -p dist
          git fetch --depth=1 origin output 2>/dev/null \
            && git show origin/output:stats.svg > dist/stats.svg 2>/dev/null \
            || echo "No previous stats card yet"

      - name: Generate stats card
        continue-on-error: true
        run: python3 scripts/generate_stats.py dist/stats.svg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#FF4FD8&color_dots=#161b22,#3b2a7a,#5b3fd0,#8b5cf6,#c4b5fd
            dist/snake-light.svg?color_snake=#7C5CFF&color_dots=#ebedf0,#e9d5ff,#c4b5fd,#a78bfa,#7c3aed

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: refresh profile assets"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
