<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="566" viewBox="0 0 1200 566" role="img" aria-labelledby="t d">
<title id="t">Achievements unlocked</title>
<desc id="d">Six achievements: Ship It ×30 — 30+ games and prototypes built and shipped on GitHub.; Live on the Web — 25+ games playable right now — no install, just a link.; Unity → Web — Rebuilt Unity games as lightweight, dependency-free HTML5.; Shape Shifter — Made polygons, triangles and parallelograms fun to learn.; Story Mode — Voiced, character-led lessons with Popo, Momo, Swiftee &amp; Kabir.; Figma → Code — From Figma frame to live game — design and code, end to end.</desc>
<defs><linearGradient id="beam" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF4FD8"/><stop offset=".5" stop-color="#7C5CFF"/><stop offset="1" stop-color="#3DE0FF"/></linearGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#fff" fill-opacity=".07"/></pattern><linearGradient id="xp" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C5CFF"/><stop offset=".6" stop-color="#FF4FD8"/><stop offset="1" stop-color="#FFB547"/></linearGradient><linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter><clipPath id="outer"><rect width="1200" height="566" rx="28"/></clipPath><linearGradient id="rLEGENDARY" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB547"/><stop offset="1" stop-color="#FF4FD8"/></linearGradient><linearGradient id="rEPIC" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9B7BFF"/><stop offset="1" stop-color="#D3B8FF"/></linearGradient><linearGradient id="rRARE" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3DE0FF"/><stop offset="1" stop-color="#5B8CFF"/></linearGradient><clipPath id="k0"><rect width="357" height="212" rx="20"/></clipPath><clipPath id="k1"><rect width="357" height="212" rx="20"/></clipPath><clipPath id="k2"><rect width="357" height="212" rx="20"/></clipPath><clipPath id="k3"><rect width="357" height="212" rx="20"/></clipPath><clipPath id="k4"><rect width="357" height="212" rx="20"/></clipPath><clipPath id="k5"><rect width="357" height="212" rx="20"/></clipPath></defs>
<style>.sans{font-family:Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}.mono{font-family:'JetBrains Mono','SF Mono',SFMono-Regular,ui-monospace,Menlo,Consolas,'Liberation Mono',monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}.beam{animation:beam 7s linear infinite}@keyframes beam{to{stroke-dashoffset:-1000}}
.hud{font-size:13px;font-weight:700;letter-spacing:3px;fill:#A7A3C7}
.cnt{font-size:13px;font-weight:800;letter-spacing:2px;fill:#C6FF3D}
.rar{font-size:11.5px;font-weight:800;letter-spacing:2.4px}
.at{font-size:22px;font-weight:800;fill:#F4F2FF}
.ad{font-size:15px;fill:#A7A3C7}
.ok{font-size:11.5px;font-weight:800;letter-spacing:1.6px;fill:#C6FF3D}
.xp{font-size:12px;font-weight:800;letter-spacing:1px}
.card{transform-box:fill-box;transform-origin:center;animation:pop .8s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes pop{from{opacity:0;transform:translateY(22px) scale(.96)}}
.shine{animation:shine 7s ease-in-out infinite}
@keyframes shine{0%{transform:translateX(0) skewX(-20deg)}16%,100%{transform:translateX(560px) skewX(-20deg)}}
.halo{animation:halo 3.2s ease-in-out infinite}
@keyframes halo{0%,100%{opacity:.18}50%{opacity:.6}}
.fill{transform-box:fill-box;transform-origin:left center;animation:fill 2.4s cubic-bezier(.2,.8,.2,1) .3s backwards}
@keyframes fill{from{transform:scaleX(0)}}
</style>

