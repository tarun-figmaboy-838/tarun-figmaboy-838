  <g transform="translate(1160 66)"><g class="bob bob2"><polygon class="spin rev" points="0.00,-12.00 10.39,-6.00 10.39,6.00 0.00,12.00 -10.39,6.00 -10.39,-6.00" fill="none" stroke="#C6FF3D" stroke-width="2" stroke-opacity=".55"/></g></g>
  <g transform="translate(650 56) scale(1.0)"><path class="tw" style="animation-delay:0s" d="M0 -8C1 -2 2 -1 8 0C2 1 1 2 0 8C-1 2 -2 1 -8 0C-2 -1 -1 -2 0 -8Z" fill="#C6FF3D"/></g><g transform="translate(1168 300) scale(0.8)"><path class="tw" style="animation-delay:1.3s" d="M0 -8C1 -2 2 -1 8 0C2 1 1 2 0 8C-1 2 -2 1 -8 0C-2 -1 -1 -2 0 -8Z" fill="#3DE0FF"/></g><g transform="translate(618 404) scale(0.7)"><path class="tw" style="animation-delay:0.7s" d="M0 -8C1 -2 2 -1 8 0C2 1 1 2 0 8C-1 2 -2 1 -8 0C-2 -1 -1 -2 0 -8Z" fill="#FF4FD8"/></g><g transform="translate(1150 34) scale(0.6)"><path class="tw" style="animation-delay:2.0s" d="M0 -8C1 -2 2 -1 8 0C2 1 1 2 0 8C-1 2 -2 1 -8 0C-2 -1 -1 -2 0 -8Z" fill="#fff"/></g><g transform="translate(560 120) scale(0.55)"><path class="tw" style="animation-delay:1.7s" d="M0 -8C1 -2 2 -1 8 0C2 1 1 2 0 8C-1 2 -2 1 -8 0C-2 -1 -1 -2 0 -8Z" fill="#fff"/></g>

