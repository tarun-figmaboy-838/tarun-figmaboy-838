<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d">
<title id="t">Tarun Diwedi — UI/UX Designer × Game Developer</title>
<desc id="d">Animated banner: Tarun Diwedi, UI/UX designer and game developer, available for freelance and full-time work worldwide.</desc>
<defs><clipPath id="clip"><rect width="1200" height="440" rx="28"/></clipPath><clipPath id="board"><rect x="772" y="84" width="356" height="256" rx="18"/></clipPath><radialGradient id="gv"><stop offset="0" stop-color="#7C5CFF" stop-opacity=".55"/><stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/></radialGradient><radialGradient id="gp"><stop offset="0" stop-color="#FF4FD8" stop-opacity=".38"/><stop offset="1" stop-color="#FF4FD8" stop-opacity="0"/></radialGradient><radialGradient id="gc"><stop offset="0" stop-color="#3DE0FF" stop-opacity=".30"/><stop offset="1" stop-color="#3DE0FF" stop-opacity="0"/></radialGradient><linearGradient id="name" x1="0" y1="0" x2="1" y2="0" spreadMethod="repeat"><stop offset="0" stop-color="#C4B5FF"/><stop offset=".33" stop-color="#FF4FD8"/><stop offset=".66" stop-color="#3DE0FF"/><stop offset="1" stop-color="#C4B5FF"/><animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1 0" dur="6s" repeatCount="indefinite"/></linearGradient><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1A1540"/><stop offset="1" stop-color="#2D2062"/></linearGradient><linearGradient id="hexfill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF8AE6"/><stop offset="1" stop-color="#7C5CFF"/></linearGradient><radialGradient id="fade" cx="32%" cy="42%" r="78%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><mask id="dotmask"><rect width="1200" height="440" fill="url(#fade)"/></mask><filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="beam" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF4FD8"/><stop offset=".5" stop-color="#7C5CFF"/><stop offset="1" stop-color="#3DE0FF"/></linearGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#fff" fill-opacity=".07"/></pattern></defs>
<style>.sans{font-family:Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}.mono{font-family:'JetBrains Mono','SF Mono',SFMono-Regular,ui-monospace,Menlo,Consolas,'Liberation Mono',monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}.beam{animation:beam 7s linear infinite}@keyframes beam{to{stroke-dashoffset:-1000}}
.pill{font-size:12.5px;font-weight:700;fill:#C6FF3D;letter-spacing:1.6px}
.hey{font-size:26px;font-weight:600;fill:#CFCBEA}
.name{font-size:84px;font-weight:900;letter-spacing:-1.5px}
.sub{font-size:30px;font-weight:700;fill:#F4F2FF}
.tag{font-size:19px;fill:#B9B5DA}
.chip{font-size:13px;font-weight:600;fill:#E6E3FA}
.lbl{font-size:11.5px;fill:#8E8AB5}
.btn{font-size:12px;font-weight:800;fill:#0B0A14}
.cur{font-size:11.5px;font-weight:700}
.dim{font-size:10px;font-weight:700;fill:#fff}
.blob{animation:drift 14s ease-in-out infinite alternate}
.b2{animation-duration:18s;animation-delay:-6s}
.b3{animation-duration:22s;animation-delay:-11s}
@keyframes drift{0%{transform:translate(0,0)}50%{transform:translate(60px,30px)}100%{transform:translate(-40px,18px)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
.rev{animation-direction:reverse;animation-duration:32s}
@keyframes spin{to{transform:rotate(360deg)}}
.bob{animation:bob 6s ease-in-out infinite}
.bob2{animation-duration:8s;animation-delay:-3s}
@keyframes bob{50%{transform:translateY(-12px)}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2.8)}}
.wave{transform-box:fill-box;transform-origin:70% 85%;animation:wave 2.6s ease-in-out infinite}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-8deg)}}
.rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) backwards}
.d1{animation-delay:.12s}.d2{animation-delay:.24s}.d3{animation-delay:.36s}.d4{animation-delay:.48s}.d5{animation-delay:.6s}.d6{animation-delay:.5s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
.ga{opacity:0;animation:ga 4.5s steps(1) infinite}
.gb{opacity:0;animation:gb 4.5s steps(1) infinite}
@keyframes ga{0%,88%,100%{opacity:0;transform:none}89%{opacity:.85;transform:translate(-5px,2px)}91%{opacity:.85;transform:translate(4px,-1px)}93%{opacity:0}}
@keyframes gb{0%,88%,100%{opacity:0;transform:none}89%{opacity:.85;transform:translate(5px,-2px)}91%{opacity:.85;transform:translate(-3px,1px)}93%{opacity:0}}
.hopY{animation:hopY 1.6s infinite}
@keyframes hopY{0%,14%{transform:translateY(0);animation-timing-function:cubic-bezier(.2,.7,.4,1)}50%{transform:translateY(-44px);animation-timing-function:cubic-bezier(.6,0,.8,.3)}86%,100%{transform:translateY(0)}}
.squash{transform-box:fill-box;transform-origin:50% 100%;animation:squash 1.6s infinite}
@keyframes squash{0%{transform:scale(1.1,.9)}14%{transform:scale(1.14,.86)}24%{transform:scale(.92,1.08)}50%{transform:scale(1)}84%{transform:scale(.95,1.05)}92%,100%{transform:scale(1.1,.9)}}
.shadow{transform-box:fill-box;transform-origin:center;animation:shadow 1.6s infinite}
@keyframes shadow{0%,14%,86%,100%{transform:scale(1);opacity:1}50%{transform:scale(.55);opacity:.5}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 3.6s infinite}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.coin{transform-box:fill-box;transform-origin:center;animation:coin 1.4s linear infinite}
@keyframes coin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.12)}}
.curY{animation:curY 8s infinite cubic-bezier(.45,0,.25,1)}
@keyframes curY{0%{transform:translate(0,0)}20%{transform:translate(60px,64px)}40%{transform:translate(126px,14px)}60%,82%{transform:translate(214px,-34px)}100%{transform:translate(0,0)}}
.curT{animation:curT 9s infinite cubic-bezier(.45,0,.25,1)}
@keyframes curT{0%{transform:translate(0,0)}18%,30%{transform:translate(-28px,-92px)}50%,62%{transform:translate(-118px,-30px)}80%{transform:translate(-64px,-146px)}100%{transform:translate(0,0)}}
.press{transform-box:fill-box;transform-origin:center;animation:press 8s infinite}
@keyframes press{0%,61%,67%,100%{transform:scale(1)}63%{transform:scale(.86)}}
.ripple{transform-box:fill-box;transform-origin:center;opacity:0;animation:ripple 8s infinite}
@keyframes ripple{0%,61%{opacity:0;transform:scale(.4)}62%{opacity:.95;transform:scale(.6)}74%,100%{opacity:0;transform:scale(2.6)}}
.tool{animation:tool 8s infinite}
@keyframes tool{0%,24.9%{transform:translateX(0)}25%,49.9%{transform:translateX(40px)}50%,74.9%{transform:translateX(80px)}75%,100%{transform:translateX(120px)}}
</style>

