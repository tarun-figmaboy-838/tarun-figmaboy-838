.tw{transform-box:fill-box;transform-origin:center;animation:tw 3.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.5)}50%{opacity:1;transform:scale(1)}}
.rise{animation:rise 1s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.drift{animation:drift 46s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0) scale(1.08)}to{transform:translate(-36px,-10px) scale(1.16)}}
.spk{opacity:0;transform-box:fill-box;transform-origin:center}
.dot{transform-box:fill-box;transform-origin:center;animation:dot 1.8s ease-out infinite}
@keyframes dot{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2.8)}}
.shine{animation:shine 8s ease-in-out infinite}
@keyframes shine{0%{transform:translateX(0)}22%,100%{transform:translateX(760px)}}
.shine{animation-duration:5s}</style>
