<title id="t">Conjuring interfaces in Figma, casting them into the browser</title>
<desc id="d">Incantations written in gold: Conjuring interfaces in Figma, casting them into the browser; 30+ enchanted learning games, built and shipped; Unity games, transmuted into lightweight HTML5; Turning maths into magic: shapes, fractions, counting; Open to quests from clients &amp; companies worldwide; Let&#x27;s build something people love to play</desc>
