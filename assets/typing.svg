.flick{transform-box:fill-box;transform-origin:center;animation:flick 1.7s ease-in-out infinite}
@keyframes flick{0%,100%{opacity:.7;transform:scale(1)}22%{opacity:1;transform:scale(1.08,1.15)}46%{opacity:.55;transform:scale(.92,.95)}71%{opacity:.9;transform:scale(1.04,1.1)}}
